# SearXNG settings for LOCAL DEVELOPMENT ONLY (see the README).
#
# The fleet's instance on beam03 keeps its own settings.yml, with a real random
# secret_key that is not in git. The secret_key below is an obvious placeholder,
# safe to commit, because this file only ever configures a throwaway local
# container.
#
# max_request_timeout matters to mcl-search: the service's fetch must outlast
# it, and a test compares the two.

use_default_settings: true

general:
  instance_name: "mcl-search-dev"
  debug: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "local-dev-only-not-a-real-secret-do-not-deploy-this-value"
  limiter: false

ui:
  static_use_hash: true

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  useragent_suffix: ""
